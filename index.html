<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home styling · Josh &amp; Amy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,560&family=Outfit:wght@340;460;560&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="top">
      <p class="eyebrow">For Josh &amp; Amy</p>
      <h1>Home styling</h1>
      <p class="lede">One lounge, one recommended style, and a Good, Better and Best way to buy it.</p>
    </header>
    <main>
      <section class="stage-wrap" aria-label="Lounge">
        <div class="stage" id="stage">
          <img id="base" class="base" alt="" width="1400" height="2100" />
          <img class="layer" data-layer="rug" alt="" hidden />
          <img class="layer" data-layer="throw" alt="" hidden />
          <img class="layer" data-layer="cushions" alt="" hidden />
          <img class="layer" data-layer="wall-art" alt="" hidden />
          <svg id="hits" class="hits" viewBox="0 0 1400 2100"></svg>
          <p id="stage-label" class="stage-label" hidden></p>
        </div>
        <p id="placement" class="placement">Product photo, placed in the room.</p>
        <p class="hint">Tap a cushion, the rug, the throw or the right-hand picture. Swipe sideways on it to change only that item.</p>
      </section>
      <section id="analysis" class="panel" aria-live="polite"></section>
      <section id="style" class="panel"></section>
      <div id="carousels"></div>
      <section id="catalogue" class="panel"></section>
    </main>
    <footer id="credit"></footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
